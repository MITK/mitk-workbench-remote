stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.python-base:
  image: python:${PYTHON_VERSION}
  tags:
    - sci-runner
  before_script:
    - pip install -e ".[dev]"

lint:
  extends: .python-base
  stage: lint
  variables:
    # Must be >= the project's requires-python (3.11):
    # 3.12 also installs a numpy with PEP 696 ndarray
    # TypeVar defaults and matches mypy's python_version (see [tool.mypy]).
    PYTHON_VERSION: "3.12"
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/
    - mypy --strict src/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  extends: .python-base
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - pytest --cov=mitk_workbench_remote --cov-report=term-missing
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

smoke-optional:
  extends: .python-base
  stage: test
  variables:
    PYTHON_VERSION: "3.12"
  # Install only the stable optional extras (not [dev]) so the job exercises
  # converter auto-registration against the real SimpleITK and mlarray
  # packages. mitk-python is excluded here: it is a heavy native binding
  # published only for CPython 3.12, so it cannot install across this job's
  # peers on 3.11/3.13; it is validated manually at release time rather than in
  # CI. A dedicated gated 3.12 job is tracked separately (see ISSUE_DRAFT_mitk_python_ci.md).
  before_script:
    - pip install -e ".[simpleitk,mlarray]"
  script:
    - python -c "import mitk_workbench_remote"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
