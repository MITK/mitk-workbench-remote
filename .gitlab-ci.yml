stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.python-base:
  image: python:${PYTHON_VERSION}
  tags:
    - sci-runner
  before_script:
    - pip install -e ".[dev]"

lint:
  extends: .python-base
  stage: lint
  variables:
    # Lint on the minimum supported Python so the installed numpy matches mypy's
    # python_version target (3.10). Newer numpy requires Python 3.11+ and ships
    # PEP 695 "type" statements in its stubs, which mypy rejects under
    # python_version=3.10; pinning the lint runtime to 3.10 installs a
    # 3.10-compatible numpy whose stubs do not use that syntax.
    PYTHON_VERSION: "3.10"
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/
    - mypy --strict src/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  extends: .python-base
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    - pytest --cov=mitk_workbench_remote --cov-report=term-missing
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

smoke-optional:
  extends: .python-base
  stage: test
  variables:
    PYTHON_VERSION: "3.12"
  # Install only the stable optional extras (not [dev]) so the job exercises
  # converter auto-registration against the real SimpleITK and mlarray
  # packages. mitk-python is excluded here: it is a dev-only, pre-release
  # native binding, validated manually at release time rather than in CI.
  before_script:
    - pip install -e ".[simpleitk,mlarray]"
  script:
    - python -c "import mitk_workbench_remote"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
