stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.python-base:
  image: python:${PYTHON_VERSION}
  tags:
    - sci-runner
  before_script:
    - pip install -e ".[dev]"

lint:
  extends: .python-base
  stage: lint
  variables:
    PYTHON_VERSION: "3.12"
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/
    - mypy src/ || true  # stubs not yet available for all deps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

test:
  extends: .python-base
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  script:
    - pytest --cov=mitk_workbench_remote --cov-report=term-missing
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
