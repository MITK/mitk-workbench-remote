name: publish

# One workflow, two triggers:
#   workflow_dispatch -> TestPyPI (stage and validate a release candidate)
#   release: published -> PyPI    (publish the version cut by a GitHub Release)
# Publishing uses PyPI Trusted Publishing (OIDC) bound to the `testpypi` and
# `pypi` GitHub Environments; no API tokens are stored.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - if: github.event_name == 'release'   # fail fast if tag != package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/mitk_workbench_remote/_version.py').read_text()).group(1))")
          test "$TAG" = "$PKG" || { echo "tag $TAG != version $PKG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
