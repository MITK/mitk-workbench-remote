[build-system]
# PEP 517/518: Required so pip knows how to build this package.
# Hatchling is a lightweight build backend that supports dynamic
# versioning via _version.py.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitk-workbench-remote"
dynamic = ["version"]
description = "Remote control for MITK Workbench from Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "MITK Development Team", email = "mitk@dkfz.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
    "numpy>=1.22",
    "pynrrd>=1.0",
]

[project.optional-dependencies]
simpleitk = ["SimpleITK>=2.2"]
mlarray = ["mlarray>=0.0.53"]
mitk = ["mitk-python"]
# `layout` enables the typed mitk.mxn.layout DSL paths on MxNEditor
# (get_layout, set_layout(MxNLayoutDocument | str | Path),
# update_layout, apply_grid, apply_preset). Raw-dict layout I/O
# (get_layout_json, set_layout(dict)) does not require this extra.
layout = ["mitk-python"]
all = ["SimpleITK>=2.2", "mlarray>=0.0.53"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "responses>=0.23",
    "ruff",
    "mypy",
    "build",
    "twine",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "pypandoc-binary",
    "ipykernel",
    "sphinx-copybutton",
]

[project.urls]
Homepage = "https://github.com/MITK/mitk-workbench-remote"
Documentation = "https://mitk-workbench-remote.readthedocs.io"
Repository = "https://github.com/MITK/mitk-workbench-remote"
Issues = "https://github.com/MITK/mitk-workbench-remote/issues"

[tool.hatch.version]
path = "src/mitk_workbench_remote/_version.py"

# Curate the sdist explicitly. Without an include list hatchling bundles
# the whole project root, which would ship stray top-level files (design
# notes, scratch scripts). The wheel only needs the package. Built docs and
# notebook checkpoints are VCS-ignored, which hatchling honors even under an
# explicit include, so docs/ ships sources only.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/contract",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mitk_workbench_remote"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "SIM",            # simplify
    "RUF",            # ruff-specific
]

[tool.mypy]
# Target 3.12 (one above the 3.11 project minimum): numpy >=2.5 ships PEP 695
# "type" statements in its stubs, which mypy only accepts when targeting 3.12+.
# Runtime support for Python 3.11 is covered by the pytest matrix in .gitlab-ci.yml.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nrrd"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "SimpleITK.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlarray.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mitk.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running MITK Workbench instance",
]
addopts = "-m 'not integration'"
